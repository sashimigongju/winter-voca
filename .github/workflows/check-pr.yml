name: Check schedule site PR
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check schedule.js
      - run: node --check today-manager.js
      - run: node --check admin-assistant.js
